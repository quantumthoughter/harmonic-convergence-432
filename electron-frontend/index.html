<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonance Sanctuary · 432 Hz Pipeline</title>
<style>
:root{--bg:#0a0612;--ameth:#9b6dff;--em:#34d399;--gold:#d9aa3a;--text:#d8d0f0;--muted:#9080b8;--panel:#14102a;--soft:#2a2050}
*{margin:0;box-sizing:border-box}
body{height:100vh;background:linear-gradient(135deg,#0a0612,#100828);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
.titlebar{-webkit-app-region:drag;height:40px;display:flex;align-items:center;padding:0 16px;background:linear-gradient(90deg,rgba(155,109,255,.08),transparent);font-size:13px;color:var(--gold);gap:10px;flex-shrink:0}
.titlebar .dot{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--ameth),var(--em),var(--ameth));box-shadow:0 0 12px rgba(155,109,255,.3);-webkit-app-region:no-drag}

.main{display:flex;flex:1;padding:8px;gap:8px;overflow:hidden;justify-content:center;align-items:center}

/* Center card */
.pipe-card{
  width:520px;max-width:90vw;
  background:linear-gradient(145deg,rgba(20,16,42,.95),rgba(15,10,30,.97));
  border:1px solid rgba(155,109,255,.1);border-radius:20px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.pipe-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px 10px;border-bottom:1px solid rgba(155,109,255,.06)
}
.pipe-h h1{margin:0;font-size:15px;color:var(--gold);letter-spacing:.08em;font-weight:700}
.pipe-h span{font-size:9px;color:var(--muted)}
.pipe-b{padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px}

/* Drop Zone */
#dropZone{
  border:1.5px dashed rgba(155,109,255,.12);border-radius:14px;padding:20px;
  text-align:center;cursor:pointer;font-size:12px;color:var(--muted);
  background:rgba(155,109,255,.02);transition:all .3s
}
#dropZone:hover{border-color:var(--ameth);background:rgba(155,109,255,.04)}
#dropZone.ok{border-color:var(--em);color:var(--em2);background:rgba(52,211,153,.02)}

/* Detection display */
.det-row{display:flex;align-items:center;gap:10px}
.det-box{
  flex:1;background:rgba(15,10,30,.6);border-radius:10px;padding:10px 14px;
  border:1px solid rgba(155,109,255,.06)
}
.det-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.det-value{font-size:18px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
.det-method{font-size:8px;color:var(--muted);margin-top:1px}

/* CQT Canvas */
.cqt-wrap{background:#03020a;border-radius:10px;padding:2px;border:1px solid rgba(155,109,255,.06)}
.cqt-wrap canvas{display:block;width:100%;height:100px;background:#000;border-radius:8px}
.cqt-labels{display:flex;justify-content:space-between;padding:1px 8px;font-size:6px;color:var(--muted)}

/* Buttons */
button{cursor:pointer;border:none;border-radius:8px;font-weight:600;transition:all .2s;font-family:inherit}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn-heal{
  flex:1;min-width:120px;
  background:linear-gradient(135deg,#9b6dff,#6a3db8);color:#fff;
  box-shadow:0 2px 20px rgba(155,109,255,.2);font-size:14px;padding:12px 20px
}
.btn-heal:hover{box-shadow:0 4px 30px rgba(155,109,255,.35);transform:translateY(-1px)}
.btn-heal:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-save{
  flex:1;min-width:70px;
  background:rgba(155,109,255,.06);color:var(--text);
  border:1px solid rgba(155,109,255,.08);font-size:10px;padding:8px 12px
}
.btn-save:hover{background:rgba(155,109,255,.12);border-color:var(--ameth)}
.btn-both{
  background:linear-gradient(135deg,#d9aa3a,#806010);color:#fff;
  box-shadow:0 2px 12px rgba(217,170,58,.15);font-size:11px;padding:8px 14px
}
.btn-both:hover{box-shadow:0 4px 20px rgba(217,170,58,.3);transform:translateY(-1px)}

/* Status */
.status{font-size:13px;text-align:center;color:var(--em);font-weight:600;min-height:20px}
.status.er{color:#ff7a7a}

/* Progress */
.prog{height:3px;border-radius:2px;overflow:hidden;background:rgba(155,109,255,.06)}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--ameth),var(--em));border-radius:2px;transition:width .3s}

/* Flower of Life spinner */
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.6}}
.fol-spinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5;animation:pulse 2s ease-in-out infinite}
.fol-spinner svg{width:50px;height:50px;animation:spin 5s linear infinite;opacity:.5}
.cqt-wrap{position:relative}

/* Quality */
.qual-row{display:flex;gap:8px;align-items:center}
.qual-row label{font-size:9px;color:var(--muted)}
.qual-row select{background:rgba(15,10,30,.8);color:var(--text);border:1px solid rgba(155,109,255,.1);border-radius:6px;padding:4px 6px;font-size:9px;outline:none}
#metaInfo{font-size:8px;color:var(--muted);text-align:center;padding:2px 0}
</style>
</head>
<body>
<div class="titlebar"><div class="dot"></div><span>Resonance Sanctuary</span><span style="font-size:9px;color:var(--muted);margin-left:auto">∞ 432 Hz Healing · CQT Precision</span></div>
<div class="main">
  <div class="pipe-card">
    <div class="pipe-h"><h1>🌀 432 Hz Healer</h1><span>CQT Harmonic Grid</span></div>
    <div class="pipe-b">
      <div id="dropZone">Drop audio file here or click to browse</div>

      <div class="det-row">
        <div class="det-box"><div class="det-label">Original Tuning</div><div class="det-value" id="origTune">—</div><div class="det-method" id="detMethod">Awaiting file</div></div>
        <div class="det-box" style="text-align:right"><div class="det-label">Target</div><div class="det-value" id="tuneTarget" style="color:var(--em)">432 Hz</div></div>
      </div>

      <div class="cqt-wrap">
        <canvas id="cqtCanvas" width="800" height="100"></canvas>
        <div class="cqt-labels"><span>20</span><span>50</span><span>100</span><span>200</span><span>432</span><span>500</span><span>1k</span><span>2k</span><span>5k</span><span>10k</span></div>
        <div class="fol-spinner" id="folAnim" style="display:none"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="15" stroke="var(--ameth)" fill="none" stroke-width=".5"/><circle cx="42.5" cy="37" r="15" stroke="var(--ameth)" fill="none" stroke-width=".5"/><circle cx="57.5" cy="37" r="15" stroke="var(--ameth)" fill="none" stroke-width=".5"/><circle cx="35" cy="44" r="15" stroke="var(--ameth)" fill="none" stroke-width=".5"/><circle cx="65" cy="44" r="15" stroke="var(--ameth)" fill="none" stroke-width=".5"/><circle cx="42.5" cy="56" r="15" stroke="var(--ameth)" fill="none" stroke-width=".5"/><circle cx="57.5" cy="56" r="15" stroke="var(--ameth)" fill="none" stroke-width=".5"/><text x="50" y="54" text-anchor="middle" fill="var(--ameth)" font-size="14" opacity=".6">∞</text></svg></div>
      </div>
      <div class="prog"><div class="prog-fill" id="progFill"></div></div>

      <div class="qual-row">
        <label>Target</label><select id="tgtSel"><option value="432">432 Hz (Healing)</option><option value="440">440 Hz (Standard)</option><option value="444">444 Hz (Verdi)</option></select>
        <label style="margin-left:auto">MP3 Quality</label><select id="mp3Qual"><option value="320k">320 kbps</option><option value="256k">256 kbps</option><option value="192k">192 kbps</option></select>
      </div>

      <div class="btn-row">
        <button class="btn-heal" id="healBtn">✨ HEAL TO 432 Hz</button>
      </div>
      <div class="btn-row">
        <button class="btn-save" id="wavBtn">💾 Save WAV</button>
        <button class="btn-save" id="mp3Btn">💾 Save MP3</button>
        <button class="btn-both" id="bothBtn">💾 Save Both</button>
      </div>

      <div class="status" id="st">✨ Drop a file to begin</div>
      <div id="metaInfo"></div>
    </div>
  </div>
</div>
<script>
const A=window.api;let S={file:null,sid:null,srcName:null,healing:false};
let ac=null,an=null,aid=null,playSrc=null,cfg=null;

function $(id){return document.getElementById(id)}
function st(m,err){const e=$('st');e.textContent=m;e.className='status'+(err?' er':'')}

// CQT Grid lines
const GRID=[27,54,174,285,396,417,432,528,639,741,852,963];

// ─── DROP ───
const dz=$('dropZone');
dz.onclick=async()=>{const f=await A.openFile();if(f)loadFile(f)};
dz.ondragover=e=>{e.preventDefault();dz.style.borderColor='var(--ameth)'};
dz.ondragleave=()=>{dz.style.borderColor=''};
dz.ondrop=async e=>{e.preventDefault();dz.style.borderColor='';const p=A.getPathForFile(e.dataTransfer.files[0]);if(p)loadFile(p)};

async function loadFile(f){
  S.file=f;S.sid=null;S.srcName=null;
  dz.textContent='🎵 '+f.split('/').pop();dz.classList.add('ok');
  st('🔍 Detecting tuning...');
  try{
    const r=await A.post('/api/detect',{file_path:f});cfg=r;
    $('origTune').textContent=r.tuning.toFixed(1)+' Hz';
    $('detMethod').textContent=r.method+' · '+(r.confidence*100).toFixed(0)+'% confidence';
    const t=+$('tgtSel').value;
    if(Math.abs(r.tuning-t)<=1.5){
      $('origTune').style.color='var(--em)';
      st('✅ File already at '+t+' Hz — no shift needed');
      $('healBtn').textContent='✨ Add Layers';
    }else{
      $('origTune').style.color='var(--gold)';
      st('→ Will shift '+r.tuning.toFixed(1)+' Hz to '+t+' Hz');
      $('healBtn').textContent='✨ HEAL TO '+t+' Hz';
    }
    // Load into CQT
    try{
      if(ac){ac.close();ac=null}
      ac=new(window.AudioContext||window.webkitAudioContext)();
      const resp=await fetch('file://'+f);const buf=await resp.arrayBuffer();
      const audioBuf=await ac.decodeAudioData(buf);
      playSrc=ac.createBufferSource();playSrc.buffer=audioBuf;playSrc.loop=true;
      an=ac.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=0.7;
      playSrc.connect(an);an.connect(ac.destination);playSrc.start(0);
      startCQT();
    }catch(e){console.log('CQT load:',e.message)}
  }catch(e){st(e.message,1)}
}

// ─── CQT ───
function startCQT(){
  if(!an)return;
  const bl=an.frequencyBinCount,da=new Uint8Array(bl);
  const cv=$('cqtCanvas'),ctx=cv.getContext('2d');
  const resize=()=>{cv.width=cv.clientWidth;cv.height=100};
  resize();window.addEventListener('resize',resize);
  const H=100,fm=20,fx=10000,bp=24;
  const nb=Math.floor(bp*Math.log2(fx/fm))+1,cf=[];
  for(let i=0;i<=nb;i++){const f=fm*Math.pow(2,i/bp);if(f<=fx)cf.push(f)}
  const fi=[];const sr=44100;
  for(let i=0;i<cf.length;i++)fi.push(Math.min(Math.round(cf[i]*8192/sr),bl-1));
  const lm=Math.log10(fm),lx=Math.log10(fx);
  // Grid positions for 432 highlight
  const grid432=[27,54,174,285,396,417,432,528,639,741,852,963];
  function draw(){
    if(!an){aid=requestAnimationFrame(draw);return}
    an.getByteFrequencyData(da);
    ctx.fillStyle='#03020a';ctx.fillRect(0,0,cv.width,H);
    const W=cv.width;
    // Grid lines — 432 Hz gets special treatment
    for(const g of grid432){
      if(g<fm||g>fx)continue;
      const x=((Math.log10(g)-lm)/(lx-lm))*W;
      const is432=g===432;
      ctx.strokeStyle=is432?'rgba(217,170,58,.3)':'rgba(155,109,255,.06)';
      ctx.lineWidth=is432?1.5:.5;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H-12);ctx.stroke();
    }
    // Spectrum
    const bw=W/cf.length;
    for(let i=0;i<cf.length;i++){
      let v=da[fi[i]]/255;v=Math.pow(v,.7);
      const hue=240+v*50;ctx.fillStyle=`hsla(${hue},70%,50%,${0.3+v*0.7})`;
      ctx.fillRect(i*bw,H-v*H,bw-1,v*H);
    }
    // 432 Hz label at top
    const x432=((Math.log10(432)-lm)/(lx-lm))*W;
    ctx.fillStyle='rgba(217,170,58,.5)';ctx.font='8px monospace';ctx.textAlign='center';
    ctx.fillText('432 Hz',x432,10);
    aid=requestAnimationFrame(draw);
  }
  draw();
}

// ─── HEAL ───
$('healBtn').onclick=async function(){
  if(!S.file||S.healing)return;S.healing=true;
  $('folAnim').style.display='flex';$('progFill').style.width='20%';
  st('🌀 Healing to 432 Hz...');
  try{
    const r=await A.post('/api/heal',{file_path:S.file,target_tuning:+$('tgtSel').value,pure_432:true});
    S.sid=r.session_id;S.srcName=r.source_name;
    $('progFill').style.width='100%';
    setTimeout(()=>{$('folAnim').style.display='none';$('progFill').style.width='0%'},600);
    $('origTune').textContent=r.heal_result.target_tuning.toFixed(1)+' Hz ✓';
    $('origTune').style.color='var(--em)';
    $('detMethod').textContent='Healed · '+r.heal_result.original_tuning.toFixed(1)+' → '+r.heal_result.target_tuning.toFixed(1)+' Hz';
    st('✅ Healed successfully',false);
    $('metaInfo').textContent='Session: '+S.sid+' · '+r.sample_rate+' Hz · '+(r.mix_shape?r.mix_shape.join('×'):'stereo');
  }catch(e){$('folAnim').style.display='none';st(e.message,1)}
  S.healing=false;
};

// ─── SAVE ───
async function saveFile(fmt){
  if(!S.sid){st('Heal a file first',1);return}
  const base=(S.srcName||S.file||'healed').split('/').pop().replace(/\.[^.]+$/,'')+'_432';
  const d=await A.saveFile(base+'.'+fmt);if(!d)return;
  try{
    const b=await A.downloadBuffer('/api/download/'+S.sid+'?format='+fmt+'&name='+encodeURIComponent(base));
    await A.writeFile(d,Array.from(new Uint8Array(b)));
    st('💾 Saved '+base+'.'+fmt);
  }catch(e){st(e.message,1)}
}
$('wavBtn').onclick=()=>saveFile('wav');
$('mp3Btn').onclick=()=>saveFile('mp3');
$('bothBtn').onclick=async()=>{
  if(!S.sid){st('Heal a file first',1);return}
  const base=(S.srcName||S.file||'healed').split('/').pop().replace(/\.[^.]+$/,'')+'_432';
  try{
    const bw=await A.downloadBuffer('/api/download/'+S.sid+'?format=wav&name='+encodeURIComponent(base));
    await A.writeFile((await A.saveFile(base+'.wav')),Array.from(new Uint8Array(bw)));
    const bm=await A.downloadBuffer('/api/download/'+S.sid+'?format=mp3&name='+encodeURIComponent(base));
    await A.writeFile((await A.saveFile(base+'.mp3')),Array.from(new Uint8Array(bm)));
    st('💾 Both files saved');
  }catch(e){st(e.message,1)}
};
</script>
</body>
</html>
